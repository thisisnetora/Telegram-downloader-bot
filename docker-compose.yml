services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - bot_data:/data
    environment:
      # Stats & cookies live on the persistent volume — survive restarts/rebuilds.
      DATA_FILE: ${DATA_FILE:-/data/bot_data.json}
      COOKIES_FILE: ${COOKIES_FILE:-/data/cookies.txt}

volumes:
  bot_data:
